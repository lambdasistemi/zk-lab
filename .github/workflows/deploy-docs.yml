name: Build and deploy documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Docs
    runs-on: nixos
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/cachix-action@v15
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build docs
        run: nix run --quiet .#docs-build

      - name: Smoke-test docs on localhost
        run: |
          nix shell nixpkgs#python3 nixpkgs#curl --quiet -c bash -euo pipefail <<'SCRIPT'
          python3 -m http.server 4173 --bind 127.0.0.1 --directory site &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done

          body=$(curl -fsS http://127.0.0.1:4173/dsl/parity-matrix/)
          grep -qi 'set.membership' <<<"$body"
          SCRIPT

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        run: nix run --quiet .#docs-deploy
